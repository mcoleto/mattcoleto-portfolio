<footer class="footer" role="contentinfo">
  <div class="footer__inner container">
    <div class="footer__brand">
      <span class="footer__logo">Matt Coleto</span>
      <p class="footer__tagline">Crafting cultural impact at scale.</p>
    </div>

    <nav class="footer__nav" aria-label="Footer navigation">
      <ul role="list">
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/about' | relative_url }}">About</a></li>
        <li><a href="{{ '/events' | relative_url }}">Work</a></li>
        <li><a href="{{ '/contact' | relative_url }}">Contact</a></li>
        {% if site.kuulective_url != "" %}<li><a href="{{ site.kuulective_url }}">Kuulective</a></li>{% endif %}
      </ul>
    </nav>

    <div class="footer__social">
      <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
      </a>
      <a href="{{ site.author.twitter }}" target="_blank" rel="noopener noreferrer" aria-label="X / Twitter">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <a href="mailto:{{ site.author.email }}" aria-label="Email Matt">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      </a>
    </div>
  </div>

  <div class="footer__bottom">
    <p>&copy; {{ 'now' | date: "%Y" }} Matt Coleto. All rights reserved.</p>
  </div>
</footer>
