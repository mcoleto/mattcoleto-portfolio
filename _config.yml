title: Matt Coleto
tagline: Event & Brand Marketing for Anime, K-pop and Esports
description: Bay Area event and brand marketer with 10+ years in anime, K-pop and esports. Crunchyroll Anime Awards, KCON, Clash Royale League. See my work and resume.
url: "https://mattcoleto.com"
baseurl: ""

author:
  name: Matt Coleto
  email: matt.coleto@gmail.com
  # CONFIRM: the old Squarespace site used linkedin.com/in/matthewcoleto and @kuurrochurro;
  # the resume uses linkedin.com/in/mattcoleto. Keep whichever is really yours.
  linkedin: https://www.linkedin.com/in/matthewcoleto/
  twitter: https://twitter.com/kuurrochurro
  instagram: https://www.instagram.com/kuu.rro/
  # Add a headshot at this path and it replaces the monogram on Home and About.
  photo: /assets/images/matt-coleto.jpg

# Contact form: create a free form at formspree.io and paste its ID here (e.g. xpwzgkqv).
# Until then the Contact page shows an email button instead of a broken form.
formspree_id: ""

# Set this once kuulective.com is live to show "Work with Kuulective" links.
kuulective_url: ""

# Collections
collections:
  events:
    output: true
    permalink: /events/:slug/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
  - scope:
      path: ""
      type: events
    values:
      layout: event

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins (GitHub Pages safe)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
include:
  - _redirects

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .gitignore

# SEO / Social
twitter:
  username: kuurrochurro
  card: summary_large_image

