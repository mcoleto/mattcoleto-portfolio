title: Matt Coleto
description: Events Marketing Leader crafting cultural impact at the intersection of Anime, K-pop, and Esports.
url: "https://mattcoleto.com"
baseurl: ""

author:
  name: Matt Coleto
  email: matt.coleto@gmail.com
  # Social links, as they appeared on the Squarespace site. Used by the footer and contact page.
  linkedin: https://www.linkedin.com/in/matthewcoleto/
  twitter: https://twitter.com/kuurrochurro
  twitter_handle: kuurrochurro
  instagram: https://www.instagram.com/kuu.rro/
  instagram_handle: kuu.rro

# Collections
collections:
  events:
    output: true
    permalink: /events/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: events
    values:
      layout: event

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins (GitHub Pages safe)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .gitignore
  - scripts

# Jekyll skips files that start with "_"; Cloudflare Pages needs this one
include:
  - _redirects

# SEO / Social
twitter:
  username: kuurrochurro
  card: summary_large_image

logo: /assets/images/og-image.jpg
